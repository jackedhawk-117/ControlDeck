[workspace]
resolver = "2"
members = [
    "crates/pc-protocol",
    "crates/input-core",
    "crates/input-linux",
    "crates/input-windows",
    "crates/pc-receiver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
rand_core = { version = "0.9", features = ["os"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
# keep unwinding so the panic hook can release all held inputs (Engineering Rule 11)
